# 10/5(월·대체공휴일) 14:00 경기용 티켓베이 매물 알림. 10/3 감시와 따로 돌아갑니다.
# 조건은 10/3과 같습니다: 외야 그린석 4연석, 401·402·403구역, 1장 20,000원 이하.
name: 티켓베이 매물 알림 (10/5)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: ticketbay-alert-1005-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 다음 감시 실행을 스스로 예약하기 위해 필요

env:
  GAME: "2026-10-05 14:00"
  GAME_STOP: "202610051400"   # 위 GAME과 같은 시각 (YYYYMMDDhhmm)

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ticketbay_alert/requirements.txt

      - name: 설치
        run: |
          pip install -r ticketbay_alert/requirements.txt
          python -m playwright install --with-deps chromium

      - uses: actions/cache/restore@v4
        with:
          path: ticketbay_alert/notified-1005.json
          key: ticketbay-notified-1005-${{ github.run_id }}
          restore-keys: ticketbay-notified-1005-

      # 로그인 상태(암호화됨)와 오늘 주문 여부를 10/3 감시와 같이 씁니다.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ticketbay_alert/session.enc
            ticketbay_alert/bought.json
          key: ticketbay-auth-${{ github.run_id }}
          restore-keys: ticketbay-auth-

      - name: 매물 확인
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          TICKETBAY_ID: ${{ secrets.TICKETBAY_ID }}
          TICKETBAY_PASSWORD: ${{ secrets.TICKETBAY_PASSWORD }}
          KAKAO_ID: ${{ secrets.KAKAO_ID }}
          KAKAO_PASSWORD: ${{ secrets.KAKAO_PASSWORD }}
          AUTO_BUY: ${{ vars.AUTO_BUY }}
          AUTO_BUY_AISLE_ONLY: ${{ vars.AUTO_BUY_AISLE_ONLY }}
        run: |
          [ -f ticketbay_alert/notified-1005.json ] || echo "[]" > ticketbay_alert/notified-1005.json
          python ticketbay_alert/ticketbay_alert.py --game "$GAME" --max-minutes 28 --dump

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ticketbay_alert/notified-1005.json
          key: ticketbay-notified-1005-${{ github.run_id }}

      - name: 로그인 상태 저장 준비
        if: always()
        run: |
          touch ticketbay_alert/session.enc
          [ -s ticketbay_alert/bought.json ] || echo "{}" > ticketbay_alert/bought.json

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ticketbay_alert/session.enc
            ticketbay_alert/bought.json
          key: ticketbay-auth-1005-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticketbay-dump-1005
          path: ticketbay_alert/dump-1005/
          retention-days: 3
          if-no-files-found: ignore

      - name: 다음 감시 실행 예약
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%Y%m%d%H%M)" -lt "$GAME_STOP" ]; then
            gh workflow run ticketbay-alert-1005.yml --ref "${{ github.ref_name }}"
          fi
