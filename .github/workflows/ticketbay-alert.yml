# 티켓베이 매물 알림을 GitHub 서버에서 자동으로 실행합니다.
# 15분마다 예약 실행되고, 한 번 실행되면 28분 동안 1분 간격으로 확인합니다.
# 실행이 겹치면 대기열에 들어가 끊김 없이 이어집니다.
name: 티켓베이 매물 알림

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # 아래 값을 하나라도 넣으면 "테스트 실행": 한 번만 확인하고, 알림 기록을 남기지 않습니다.
    inputs:
      sections:
        description: "테스트용 구역 (예: 117). 비우면 기본 조건"
        required: false
      max_price:
        description: "테스트용 1장 최대 가격 (예: 90000)"
        required: false
      url:
        description: "테스트용 티켓베이 목록 주소"
        required: false

concurrency:
  # 테스트 실행은 실행마다 따로(서로 취소되지 않게), 정규 감시는 하나씩 이어서 실행합니다.
  group: ticketbay-alert-${{ (inputs.sections || inputs.max_price || inputs.url) && github.run_id || 'watch' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 다음 감시 실행을 스스로 예약하기 위해 필요

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ticketbay_alert/requirements.txt

      - name: 설치
        run: |
          pip install -r ticketbay_alert/requirements.txt
          python -m playwright install --with-deps chromium

      # 이미 알린 매물 목록(notified.json)을 이전 실행에서 이어받습니다.
      - uses: actions/cache/restore@v4
        if: ${{ !(inputs.sections || inputs.max_price || inputs.url) }}
        with:
          path: ticketbay_alert/notified.json
          key: ticketbay-notified-${{ github.run_id }}
          restore-keys: ticketbay-notified-

      - name: 매물 확인
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          TEST_SECTIONS: ${{ inputs.sections }}
          TEST_MAX_PRICE: ${{ inputs.max_price }}
          TEST_URL: ${{ inputs.url }}
        run: |
          [ -f ticketbay_alert/notified.json ] || echo "[]" > ticketbay_alert/notified.json
          if [ -n "$TEST_SECTIONS$TEST_MAX_PRICE$TEST_URL" ]; then
            args=(--once --dump)
            [ -n "$TEST_SECTIONS" ] && args+=(--sections "$TEST_SECTIONS")
            [ -n "$TEST_MAX_PRICE" ] && args+=(--max-price "$TEST_MAX_PRICE")
            [ -n "$TEST_URL" ] && args+=(--url "$TEST_URL")
            python ticketbay_alert/ticketbay_alert.py "${args[@]}"
          else
            python ticketbay_alert/ticketbay_alert.py --max-minutes 28 --dump
          fi

      - uses: actions/cache/save@v4
        if: ${{ always() && !(inputs.sections || inputs.max_price || inputs.url) }}
        with:
          path: ticketbay_alert/notified.json
          key: ticketbay-notified-${{ github.run_id }}

      # 마지막으로 확인한 페이지 화면(page.png 등)을 실행 결과에서 받아볼 수 있습니다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticketbay-dump
          path: ticketbay_alert/dump/
          retention-days: 3
          if-no-files-found: ignore

      # GitHub 예약 실행은 늦거나 빠질 때가 있어서, 정상적으로 끝나면 다음 감시를 직접 이어 붙입니다.
      # (실패한 실행은 이어 붙이지 않고, 경기 시작 시간이 지나면 멈춥니다)
      - name: 다음 감시 실행 예약
        if: ${{ success() && !(inputs.sections || inputs.max_price || inputs.url) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%Y%m%d%H%M)" -lt 202610031400 ]; then
            gh workflow run ticketbay-alert.yml --ref "${{ github.ref_name }}"
          fi
